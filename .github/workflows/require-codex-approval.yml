name: Require Codex approval

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  issue_comment:
    types:
      - created
      - edited
      - deleted

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  codex-approval:
    name: Codex approval
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Codex thumbs-up
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pull_number =
              context.payload.pull_request?.number ??
              context.payload.issue?.number;

            if (!pull_number) {
              core.setFailed('Could not determine pull request number.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            const headSha = pr.head.sha;

            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: headSha
            });

            const headCommitTime = new Date(
              commit.commit.committer.date || commit.commit.author.date
            );

            const codexLogin = 'chatgpt-codex-connector[bot]';

            // Check every 20 seconds for up to 10 minutes.
            const attempts = 30;
            const delayMs = 20_000;

            for (let attempt = 1; attempt <= attempts; attempt++) {
              const reactions = await github.paginate(
                github.rest.reactions.listForIssue,
                {
                  owner,
                  repo,
                  issue_number: pull_number,
                  content: '+1',
                  per_page: 100
                }
              );

              const approval = reactions.find(
                r =>
                  r.user?.login === codexLogin &&
                  new Date(r.created_at) >= headCommitTime
              );

              if (approval) {
                core.info(
                  `Codex approved with 👍 at ${approval.created_at}.`
                );
                return;
              }

              core.info(
                `Attempt ${attempt}/${attempts}: waiting for Codex 👍...`
              );

              if (attempt < attempts) {
                await new Promise(resolve => setTimeout(resolve, delayMs));
              }
            }

            core.setFailed(
              `Codex did not add a fresh 👍 within 10 minutes for HEAD ${headSha}.`
            );

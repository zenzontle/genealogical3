# Cooldowns stay past the seven-day minimumReleaseAge in pnpm-workspace.yaml, which CI enforces.
# Don't group updates: a group can pull in releases that are still inside the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 8
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 8

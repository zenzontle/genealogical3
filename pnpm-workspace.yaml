# Corepack uses the package.json pin; keep pnpm's own version out of the lockfile.
pmOnFail: ignore

# Enforce the release delay even when no older version satisfies a requested range.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

blockExoticSubdeps: true
trustPolicy: no-downgrade
# Legacy releases without provenance, still required by @babel/core 7 and
# eslint-plugin-react (semver) and @types/node 22 (undici-types). Registry
# signatures and lockfile integrity verified on 2026-10-30. Review these
# exact-version exceptions by 2026-11-30.
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0
# Recheck locked packages against the policy, including frozen installs in CI.
trustLockfile: false

strictDepBuilds: true

# eslint-plugin-react 7.37.5 declares eslint <=9 but no newer release exists. Only
# react/no-multi-comp is used, and it works on ESLint 10 once settings.react.version is
# explicit (see eslint.config.js). Remove when eslint-plugin-react supports ESLint 10.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: '10'

# GHSA-g3hv-75wg-m249: no typescript-eslint release allows a patched minimatch yet.
# Dev-only. Remove once typescript-eslint accepts minimatch >=11.0.1; review by 2026-12-09.
# ESLint 10.15.0 and @eslint/config-array 0.23.6 move to minimatch ^11.0.5 but are still inside
# the release-age window. Remove the eslint and config-array entries once those are installed.
overrides:
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1
  'eslint>minimatch': ^11.0.1
  '@eslint/config-array>minimatch': ^11.0.1
